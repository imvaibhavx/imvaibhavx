name: Update age on profile card

on:
  schedule:
    # runs daily at 00:00 UTC (~5:30 AM IST) — cheap, and guarantees
    # the age bumps the same day as the birthday even with timezone drift
    - cron: "0 0 * * *"
  workflow_dispatch: {}
  push:
    paths:
      - "profile-card-template.svg"
      - "update_age.py"

permissions:
  contents: write

jobs:
  update-card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Regenerate profile-card.svg
        run: python update_age.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile-card.svg
          git diff --staged --quiet || git commit -m "chore: auto-update age on profile card"
          git push
